# Cedar policy store for the stand. Loaded by the Cedarling sidecar through
# CEDARLING_POLICY_STORE_LOCAL_FN (see bootstrap.json).
#
# Request shape (built by agentgateway, see agentgateway/config.yaml):
#   action   Stand::Action::"call_tool"
#   resource Stand::Tool::"<tool name>"  with attribute name = tool name
#   tokens   one access token: Stand::Access_Token from the static IdP, Jans::Access_Token from
#            the Janssen Auth Server. Cedarling gives each issuer its own entity types, in the
#            namespace named after the issuer.
#            Cedarling names the context key after the issuer:
#            context.tokens.stand_access_token for the static IdP (scripts/demo.sh, bench),
#            context.tokens.jans_access_token for the Janssen Auth Server (e2e profile).
#            Each policy accepts the scope from either issuer.
cedar_version: v4.0.0
policy_stores:
  agentgateway_stand:
    cedar_version: v4.0.0
    name: AgentgatewayStand
    description: MCP tool access for the agentgateway + Cedarling stand
    trusted_issuers:
      StandIdp:
        name: "Stand"
        openid_configuration_endpoint: "http://idp:8080/.well-known/openid-configuration"
        token_metadata:
          access_token:
            entity_type_name: "Stand::Access_Token"
      # With JWT signature and status validation disabled (bootstrap.json) Cedarling does not
      # fetch this URL, so the default profile starts without the Auth Server.
      StandJans:
        name: "Jans"
        openid_configuration_endpoint: "https://jans.stand.test/.well-known/openid-configuration"
        token_metadata:
          access_token:
            entity_type_name: "Jans::Access_Token"
    policies:
      echo_with_scope:
        description: Any token with the mcp:echo scope may call echo
        creation_date: "2026-11-20T00:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            @id("echo_with_scope")
            permit(
                principal,
                action == Stand::Action::"call_tool",
                resource == Stand::Tool::"echo"
            ) when {
                (context.tokens has stand_access_token &&
                 context.tokens.stand_access_token.hasTag("scope") &&
                 context.tokens.stand_access_token.getTag("scope").contains("mcp:echo")) ||
                (context.tokens has jans_access_token &&
                 context.tokens.jans_access_token.hasTag("scope") &&
                 context.tokens.jans_access_token.getTag("scope").contains("mcp:echo"))
            };
      sum_with_scope:
        description: get_sum needs the mcp:sum scope
        creation_date: "2026-11-20T00:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            @id("sum_with_scope")
            permit(
                principal,
                action == Stand::Action::"call_tool",
                resource == Stand::Tool::"get_sum"
            ) when {
                (context.tokens has stand_access_token &&
                 context.tokens.stand_access_token.hasTag("scope") &&
                 context.tokens.stand_access_token.getTag("scope").contains("mcp:sum")) ||
                (context.tokens has jans_access_token &&
                 context.tokens.jans_access_token.hasTag("scope") &&
                 context.tokens.jans_access_token.getTag("scope").contains("mcp:sum"))
            };
      wait_with_scope:
        description: The benchmark tool wait needs the mcp:echo scope
        creation_date: "2026-11-23T00:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            @id("wait_with_scope")
            permit(
                principal,
                action == Stand::Action::"call_tool",
                resource == Stand::Tool::"wait"
            ) when {
                (context.tokens has stand_access_token &&
                 context.tokens.stand_access_token.hasTag("scope") &&
                 context.tokens.stand_access_token.getTag("scope").contains("mcp:echo")) ||
                (context.tokens has jans_access_token &&
                 context.tokens.jans_access_token.hasTag("scope") &&
                 context.tokens.jans_access_token.getTag("scope").contains("mcp:echo"))
            };
      admin_tools:
        description: delete_records needs the mcp:admin scope
        creation_date: "2026-11-20T00:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            @id("admin_tools")
            permit(
                principal,
                action == Stand::Action::"call_tool",
                resource == Stand::Tool::"delete_records"
            ) when {
                (context.tokens has stand_access_token &&
                 context.tokens.stand_access_token.hasTag("scope") &&
                 context.tokens.stand_access_token.getTag("scope").contains("mcp:admin")) ||
                (context.tokens has jans_access_token &&
                 context.tokens.jans_access_token.hasTag("scope") &&
                 context.tokens.jans_access_token.getTag("scope").contains("mcp:admin"))
            };
    schema:
      encoding: none
      content_type: cedar
      body: |-
        namespace Stand {
          entity Access_Token = {
            token_type: String,
            jti: String,
            iss: TrustedIssuer,
            validated_at: Long,
            exp: Long,
            sub?: String,
            client_id?: String,
            scope?: Set<String>,
          } tags Set<String>;
          entity TrustedIssuer = {"issuer_entity_id": Jans::Url};
          entity Tool = {"name": String};
          entity Any;
          action "call_tool" appliesTo {
            principal: [Any],
            resource: [Tool],
            context: Context
          };
        }

        namespace Jans {
          type Url = {"host": String, "path": String, "protocol": String};
          entity TrustedIssuer = {"issuer_entity_id": Jans::Url};
          entity Access_Token = {
            token_type: String,
            jti: String,
            iss: Jans::TrustedIssuer,
            validated_at: Long,
            exp: Long,
            sub?: String,
            client_id?: String,
            scope?: Set<String>,
          } tags Set<String>;
        }

        type Context = {
          tokens: {
            stand_access_token?: Stand::Access_Token,
            jans_access_token?: Jans::Access_Token,
            total_token_count: Long
          }
        };
