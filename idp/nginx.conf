# Minimal static "IdP": serves only the OpenID discovery document and the JWKS.
# Tokens are minted offline by scripts/mint-token.sh with the matching private key.
server {
    listen 8080;
    default_type application/json;

    location = /.well-known/openid-configuration {
        alias /usr/share/nginx/idp/openid-configuration.json;
    }
    location = /jwks.json {
        alias /usr/share/nginx/idp/jwks.json;
    }
    location = /healthz {
        return 200 '{"status":"ok"}';
    }
}
