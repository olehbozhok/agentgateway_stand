name: agw-stand

services:
  # Grafana LGTM all-in-one: OTLP receiver (collector) + Tempo (traces) + Loki (logs)
  # + Prometheus (metrics) + Grafana UI. Single container, development use only.
  lgtm:
    image: grafana/otel-lgtm:${LGTM_VERSION:-0.11.0}
    ports:
      - "127.0.0.1:3001:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  idp:
    image: nginx:1.27-alpine
    volumes:
      - ./idp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./idp:/usr/share/nginx/idp:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 15

  mcp-server:
    build: ./mcp-server
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 1)"]
      interval: 2s
      retries: 30

  cedarling:
    image: ${CEDARLING_SIDECAR_IMAGE:-ghcr.io/janssenproject/jans/cedarling-flask-sidecar:0.0.0-nightly}
    environment:
      APP_MODE: development
      CEDARLING_BOOTSTRAP_CONFIG_FILE: /cedarling/bootstrap.json
      SIDECAR_DEBUG_RESPONSE: "True"
      GUNICORN_LOG_LEVEL: info
    volumes:
      - ./cedarling:/cedarling:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/.well-known/authzen-configuration', timeout=2)"]
      interval: 3s
      retries: 40

  agentgateway:
    image: ${AGENTGATEWAY_IMAGE:-cr.agentgateway.dev/agentgateway:v1.7.0}
    command: ["-f", "/config/config.yaml"]
    volumes:
      - ./agentgateway:/config:ro
    ports:
      - "127.0.0.1:3000:3000"    # MCP
      - "127.0.0.1:15020:15020"  # Prometheus metrics
    depends_on:
      idp:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      cedarling:
        condition: service_healthy
      lgtm:
        condition: service_started

  # Benchmark client, only started by scripts/bench.sh.
  bench:
    build: ./bench
    profiles: ["bench"]
    depends_on:
      agentgateway:
        condition: service_started
