# OpenShell gateway for the e2e profile: Docker compute driver, local and unauthenticated.
# Based on deploy/docker/gateway.toml of OpenShell v0.1.10. Reference: docs/openshell.md.

[openshell]
version = 2

[openshell.gateway]
# Sandbox supervisors run in host network mode and reach the gateway on the published
# 127.0.0.1:8080; the e2e runner reaches it on the Compose network.
bind_address        = "0.0.0.0:8080"
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_driver      = "docker"
disable_tls         = true

# Loopback-published, plaintext: acceptable for a local stand only.
[openshell.gateway.auth]
allow_unauthenticated_users = true

# Written by the openshell-init service.
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "agw-stand"

# Traces and OCSF audit events to the stand's LGTM. The gateway hands the same endpoint to the
# host-networked supervisors, so it must be reachable from both: host.docker.internal is.
[openshell.gateway.otlp]
endpoint     = "http://host.docker.internal:4317"
service_name = "openshell-gateway"

[openshell.gateway.otlp.ocsf]
enabled = true

[openshell.gateway.otlp.metrics]
enabled = true

[openshell.drivers.docker]
default_image         = "nvcr.io/nvidia/base/ubuntu:24.04"
sandbox_runtime_image = "quay.io/ai-openshell/sandbox:0.1.10"
supervisor_image      = "quay.io/ai-openshell/supervisor:0.1.10"
image_pull_policy     = "if_not_present"
sandbox_label         = "agw-stand"
app_armor_profile     = "Unconfined"
